[[mods]]
  modId="fast_travel_waypoints"
  version="1.4.0"
  displayName="Fast Travel Waypoints"
  displayURL=""
  logoFile="logo.png"
  credits=""
  authors="macat"
  description='''
  Adds fast travel to Waystones via Xaero's World Map instead of long, cluttered destination lists. Includes sound and visual effects, with behavior and conditions customizable in the config files.
  '''

[[dependencies.fast_travel_waypoints]]
  modId="forge"
  mandatory=true
  versionRange="[47,)"
  ordering="NONE"
  side="BOTH"

[[dependencies.fast_travel_waypoints]]
  modId="minecraft"
  mandatory=true
  versionRange="[1.20.1,1.21)"
  ordering="NONE"
  side="BOTH"

# Client-side required dependencies. Xaero's Minimap 26.4.2+ provides
# the built-in Waystones waypoint integration used instead of Waystones x Xaero's.
[[dependencies.fast_travel_waypoints]]
  modId="xaeroworldmap"
  mandatory=true
  versionRange="[1.44.2,)"
  ordering="NONE"
  side="CLIENT"

[[dependencies.fast_travel_waypoints]]
  modId="xaerominimap"
  mandatory=true
  versionRange="[26.4.2,)"
  ordering="NONE"
  side="CLIENT"

[[dependencies.fast_travel_waypoints]]
  modId="xaerolib"
  mandatory=true
  versionRange="[1.7.1,)"
  ordering="NONE"
  side="CLIENT"

# Required: Waystones provides the actual blocks/teleport targets and XP cost calculation used by this mod.
[[dependencies.fast_travel_waypoints]]
  modId="waystones"
  mandatory=true
  versionRange="[14.1.20,)"
  ordering="NONE"
  side="BOTH"

