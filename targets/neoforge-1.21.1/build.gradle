plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "Fast_Travel_Waypoints-NeoForge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDir file('../../shared/common/java')
        java.srcDir file('../../shared/mc-1.21.1/client/java')
        resources.srcDir file('../../shared/common/resources')
    }
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.mod_version) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { archiveFileName = "Fast_Travel_Waypoints-NeoForge-${minecraft_version}-v${mod_version}.jar" }
idea { module { downloadSources = true; downloadJavadoc = true } }
